<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Khana 98.4 FM</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <style>
    .tab-btn { transition: all 0.2s; }
    .tab-btn.active { background-color: #d97706; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-6">

  <div class="max-w-6xl mx-auto">

    <h1 class="text-2xl font-bold mb-4 text-center">Admin - Khana 98.4 FM</h1>

    <!-- Tab Navigation -->
    <div class="flex gap-2 mb-6">
      <button id="tabAbsensi" class="tab-btn active bg-orange-500 text-white px-5 py-2 rounded font-semibold shadow" onclick="switchTab('absensi')">📋 Absensi</button>
      <button id="tabIklan" class="tab-btn bg-gray-200 text-gray-700 px-5 py-2 rounded font-semibold shadow" onclick="switchTab('iklan')">📢 Iklan At Lips</button>
    </div>

    <!-- ===== TAB ABSENSI ===== -->
    <div id="tabAbsensiContent" class="tab-content active">
      <div class="mb-4 flex flex-wrap gap-2 items-center justify-between">
        <div class="flex gap-2">
          <input type="month" id="monthFilter" class="border rounded px-3 py-2" />
          <input type="text" id="searchInput" placeholder="Cari nama/tanggal…" class="border rounded px-3 py-2 w-64">
        </div>
        <div class="flex items-center gap-3">
          <span class="text-sm text-gray-600">Honor: <b>Rp 10.000/jam</b></span>
          <button id="exportBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Export Excel</button>
        </div>
      </div>

      <div class="overflow-x-auto bg-white rounded-xl shadow">
        <table id="rekapTable" class="min-w-full">
          <thead class="bg-gray-100 text-sm">
            <tr>
              <th class="px-4 py-3 text-left">Nama</th>
              <th class="px-4 py-3 text-left">Tanggal</th>
              <th class="px-4 py-3 text-left">Jadwal Mulai</th>
              <th class="px-4 py-3 text-left">Jadwal Selesai</th>
              <th class="px-4 py-3 text-left">Jam Masuk</th>
              <th class="px-4 py-3 text-left">Jam Pulang</th>
              <th class="px-4 py-3 text-right">Durasi (Jam)</th>
              <th class="px-4 py-3 text-right">Honor</th>
            </tr>
          </thead>
          <tbody id="rekapBody" class="text-sm"></tbody>
          <tfoot>
            <tr class="bg-gray-100 font-semibold">
              <td colspan="7" class="px-4 py-3 text-right">Total Honor</td>
              <td id="totalHonor" class="px-4 py-3 text-right">Rp 0</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <!-- ===== TAB IKLAN AT LIPS ===== -->
    <div id="tabIklanContent" class="tab-content">
      <div class="mb-4 flex flex-wrap gap-2 items-center justify-between">
        <div class="flex gap-2">
          <input type="month" id="iklanMonthFilter" class="border rounded px-3 py-2" />
          <input type="text" id="iklanSearch" placeholder="Cari announcer/iklan…" class="border rounded px-3 py-2 w-64">
        </div>
        <button id="exportIklanBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Export Excel</button>
      </div>

      <div class="overflow-x-auto bg-white rounded-xl shadow">
        <table id="iklanTable" class="min-w-full">
          <thead class="bg-gray-100 text-sm">
            <tr>
              <th class="px-4 py-3 text-left">Tanggal</th>
              <th class="px-4 py-3 text-left">Hari</th>
              <th class="px-4 py-3 text-left">Jam</th>
              <th class="px-4 py-3 text-left">Script</th>
              <th class="px-4 py-3 text-left">Announcer</th>
              <th class="px-4 py-3 text-left">Waktu Baca</th>
              <th class="px-4 py-3 text-left">Status</th>
            </tr>
          </thead>
          <tbody id="iklanBody" class="text-sm"></tbody>
          <tfoot>
            <tr class="bg-gray-100 font-semibold">
              <td colspan="6" class="px-4 py-3 text-right">Total Bacaan</td>
              <td id="totalIklan" class="px-4 py-3 text-left">0</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

  </div>

  <script src="admin.js"></script>
</body>
</html>
